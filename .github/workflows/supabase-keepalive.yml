# Supabase の無料枠は、7日間アクセスがないと一時停止される。
# 制作中は site/js/report.js が止めてある（PAUSED）ので、サイトからは通信が行かない。
# そこで、3日ごとに公開ビュー council_counts を読んで、活動があるようにしておく。
# 使うのは公開してよい publishable キーだけ（report.js と同じ）。Secrets は要らない。
# 失敗すると GitHub から通知が来る。止まってしまったら Supabase のダッシュボードで Restore する。
name: supabase-keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: council_counts を読む
        env:
          URL: https://oquuysfeistgpgrpeswq.supabase.co
          KEY: sb_publishable_IAXFoFaXZ3bjk-49Z-pD9w_SQZEgzXE
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: $KEY" \
            "$URL/rest/v1/council_counts?select=pref,council,n&limit=1"
