    <p class="theme-intro"><b>税の公平と、公立の学校を守る施策を、地方議会に求める。</b> 学校法人・宗教法人への課税の見直し、私立高校無償化の撤廃、NPO法人の会計の厳格化。</p>
    <details id="adopted" class="theme-adopted">
      <summary>陳情が採択された例</summary>
      <p class="lead-sm">市民が出した1枚の陳情が、議会で認められた例です。</p>
      <ul class="adopted-list">
        <li><b>秋田市議会（令和5年6月定例会）</b>：「豊かな学びの実現、教職員定数改善及び義務教育費国庫負担割合引上げに関する意見書の提出について」（陳情3）が、教育産業委員会で審査され、<b>採択</b>（賛成多数）されました（<a href="https://www.city.akita.lg.jp/shigikai/nittei/1036226/1038826/1038830.html" target="_blank" rel="noopener">秋田市議会の請願・陳情一覧表</a>）。</li>
      </ul>
      <p class="hint-sm">採択は、議会がその内容を認めたという意味で、そのとおりに国や自治体の施策が決まるとは限りません。</p>
    </details>
